<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - ACC Portal</title>
    <!-- Load Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Welcome - Please Login</h1>

    <div id="auth-forms">
        <!-- Login Form -->
        <form id="login-form">
            <h3>Login</h3>
            <input type="email" id="login-email" placeholder="Email" required><br><br>
            <input type="password" id="login-password" placeholder="Password" required><br><br>
            <button type="submit">Log In</button>
        </form>

        <hr style="margin: 20px 0;">

        <!-- Signup Form -->
        <form id="signup-form">
            <h3>Register Account</h3>
            <input type="text" id="signup-username" placeholder="Username" required><br><br>
            <input type="email" id="signup-email" placeholder="Email" required><br><br>
            <input type="password" id="signup-password" placeholder="Password" required><br><br>
            <button type="submit">Sign Up</button>
        </form>
    </div>

    <p id="error-msg" style="color: red;"></p>

    <script>
        // Replace with your actual Supabase project credentials
        const SUPABASE_URL = 'https://klduwrrqoyuyridfiutd.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsZHV3cnJxb3l1eXJpZGZpdXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MDM1MTYsImV4cCI6MjEwMzE3OTUxNn0.Sj1MLZ0qoDhzv7boiqTabIE6N1oesleF1Dr3g-XT1K8';
        
        //const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const supabaseClient = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

        // Check if user is already logged in, redirect to dashboard if so
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        }
        checkSession();

        // Handle Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                document.getElementById('error-msg').innerText = error.message;
            } else {
                window.location.href = 'dashboard.html';
            }
        });

        // Handle Signup
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('signup-username').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            const { data, error } = await supabaseClient.auth.signUp({
                email,
                password,
                options: { data: { username } }
            });

            if (error) {
                document.getElementById('error-msg').innerText = error.message;
            } else {
                alert('Registration successful! Check your email to confirm if required, or log in now.');
            }
        });
    </script>
</body>
</html>
