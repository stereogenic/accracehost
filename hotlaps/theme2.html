    function formatLapTime(ms) {
      if (!ms || ms === 2147483647) return '——';
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const milliseconds = ms % 1000;
      return `${minutes}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
    }

    function formatSectorTime(ms) {
      if (!ms || ms === 2147483647) return '——';
      const seconds = Math.floor(ms / 1000);
      const millis = ms % 1000;
      return `${seconds}.${millis.toString().padStart(3, '0')}`;
    }

    function formatDelta(currentMs, p1Ms) {
      if (!currentMs || !p1Ms || currentMs === p1Ms) return '——';
      const diff = currentMs - p1Ms;
      const seconds = (diff / 1000).toFixed(3);
      return `+${seconds}s`;
    }

      const isWet = String(wetlap).toLowerCase() === 'wet' || wetlap === true;

      if (!splits || !Array.isArray(splits) || splits.length === 0) return null;

            <span key={idx} className="sector-badge">
              <span className="sector-label-mini">S{idx + 1}</span>
              {formatSectorTime(splitMs)}
            </span>
          ))}
        </div>

    function parseSessionId(sessionId) {
      if (!sessionId) return { infoStr: '', type: '' };
      
      const parts = sessionId.split('_');
      if (parts.length < 3) return { infoStr: '', type: '' };

      const [datePart, timePart, remaining] = parts;
      
      const day = datePart.substring(4, 6);
      const month = datePart.substring(2, 4);
      const year = `20${datePart.substring(0, 2)}`;
      const formattedDate = `${day}/${month}/${year}`;

      const hours = timePart.substring(0, 2);
      const minutes = timePart.substring(2, 4);
      const formattedTime = `${hours}:${minutes}`;

      const typeLetter = remaining.split('-')[0];
      let sessionType = typeLetter;

      if (/^Q\d*$/.test(typeLetter)) {
        sessionType = 'Q';
      } else if (/^R\d*$/.test(typeLetter)) {
        sessionType = 'R';
      } else if (/^FP\d*$/.test(typeLetter)) {
        sessionType = 'Q';
      }

      return {
        infoStr: `${formattedDate} @ ${formattedTime}`,
        type: sessionType
      };

    function App() {
      const [uniqueTracks, setUniqueTracks] = useState([]);
      const [queryData, setQueryData] = useState([]);
      const [selectedTrack, setSelectedTrack] = useState(''); 
      const [selectedClass, setSelectedClass] = useState('ALL'); 
      const [selectedWeather, setSelectedWeather] = useState('DRY'); 
      const [searchQuery, setSearchQuery] = useState(''); 
      const [currentPage, setCurrentPage] = useState(1); 
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeDriverModal, setActiveDriverModal] = useState(null);

      // State to hold configuration file values
      const [serverConfig, setServerConfig] = useState({ servername: 'LOADING...', sitelogo: '' });

      const ITEMS_PER_PAGE = 25;

      // Fetch configuration data on mount
      useEffect(() => {
        async function loadConfig() {
          try {
            const response = await fetch('config.json');
            if (!response.ok) throw new Error('Could not load config.json');
            const config = await response.json();
            setServerConfig(config);
          } catch (err) {
            console.error('Error loading config:', err);
          }

        loadConfig();
      }, []);

      useEffect(() => { setCurrentPage(1); }, [selectedTrack, selectedClass, selectedWeather, searchQuery]);

      

      useEffect(() => {
        async function fetchTracksList() {
          try {
            const { data, error } = await supabase.rpc('get_unique_tracks');
            if (error) throw error;
            if (!data || data.length === 0) { setUniqueTracks([]); return; }
            const tracks = data.map(item => item.track ? String(item.track).trim().toLowerCase() : null).filter(Boolean);
            setUniqueTracks(tracks.sort());
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        }
        fetchTracksList();
      }, []);

      useEffect(() => {
        if (!selectedTrack) { setQueryData([]); return; }
        async function fetchFilteredLaps() {
          setLoading(true);
          try {
            let query = supabase.from('hotlaps').select('*').ilike('track', selectedTrack).order('best_lap_ms', { ascending: true }).range(0, 4999);
            if (selectedClass !== 'ALL') {
              const targetCarIds = Object.keys(CAR_CLASSES).filter(key => CAR_CLASSES[key] === selectedClass);
              query = query.in('car_model', [...targetCarIds, ...targetCarIds.map(id => Number(id))]);
            }
            if (selectedWeather === 'DRY') query = query.or('wetlap.ilike.dry,wetlap.eq.false');
            else if (selectedWeather === 'WET') query = query.or('wetlap.ilike.wet,wetlap.eq.true');

            const { data, error } = await query;
            if (error) throw error;
            setQueryData(data || []);
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        }
        fetchFilteredLaps();
      }, [selectedTrack, selectedClass, selectedWeather]);

      if (loading && uniqueTracks.length === 0) {
        return <div className="loading-screen"><code>🏁 LOADING TELEMETRY ENGINE...</code></div>;
      }
      if (error) {
        return <div className="error-screen"><code>🏁 RACE CONTROL ERROR: {error}</code></div>;
      }

      const seenDrivers = new Set();
      const baselineUniqueLaps = queryData.filter(lap => {
        if (seenDrivers.has(lap.driver_name)) return false;
        seenDrivers.add(lap.driver_name);
        return true;
      });

      const lapsWithDisplayPosition = baselineUniqueLaps.map((lap, index) => ({ ...lap, displayPosition: index + 1 }));
      const finalFilteredLaps = lapsWithDisplayPosition.filter(lap => lap.driver_name?.toLowerCase().includes(searchQuery.toLowerCase()));
      const p1Time = baselineUniqueLaps[0]?.best_lap_ms;
      const totalPages = Math.ceil(finalFilteredLaps.length / ITEMS_PER_PAGE);
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const paginatedLaps = finalFilteredLaps.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      const getDriverStats = (driverName) => {
        if (!driverName) return null;
        const driverLaps = queryData.filter(l => l.driver_name === driverName);
        const bestLap = driverLaps[0];
        const carsDriven = Array.from(new Set(driverLaps.map(l => CAR_MODELS[l.car_model] || `Car ID: ${l.car_model}`)));
        const position = baselineUniqueLaps.findIndex(l => l.driver_name === driverName) + 1;
        return {
          name: driverName, bestLapMs: bestLap?.best_lap_ms, bestSplits: bestLap?.best_splits,
          totalSessions: driverLaps.length, carsDriven, position: position > 0 ? position : 'N/A',
          delta: formatDelta(bestLap?.best_lap_ms, p1Time), wetlap: bestLap?.wetlap
        };
      };
      const driverStats = activeDriverModal ? getDriverStats(activeDriverModal) : null;

      return (
        <div className="main-container">
        <img src="{serverConfig.servername}"/>
          <a href="./">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3030"/>
      <stop offset="35%" stop-color="#d90000"/>
      <stop offset="70%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#8f0000"/>
    </linearGradient>

    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#b8b8b8"/>
      <stop offset="60%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#666666"/>
    </linearGradient>

    <radialGradient id="background" cx="48%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#101010"/>
      <stop offset="55%" stop-color="#090909"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="roundedClip">
      <rect x="0" y="0" width="600" height="150" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedClip)">
    <rect x="0" y="0" width="600" height="150" fill="url(#background)"/>

    <path d="M0 117.5 L205 0 L360 0 L127.5 150 L0 150 Z"
          fill="#151515"/>

    <path d="M350 150 L590 17.5 L600 17.5 L600 85 L482.5 150 Z"
          fill="#121212"/>

    <g opacity="0.12">
      <path d="M0 130 L225 0"
            stroke="#ffffff"
            stroke-width="0.5"/>
      <path d="M30 150 L260 17.5"
            stroke="#ffffff"
            stroke-width="0.5"/>
      <path d="M380 150 L600 25"
            stroke="#ffffff"
            stroke-width="0.5"/>
      <path d="M410 150 L600 40"
            stroke="#ffffff"
            stroke-width="0.5"/>
    </g>

    <g transform="translate(24 21.5) scale(0.5)">
      <path d="M104 0 L200 55 L200 157 L104 214 L8 157 L8 55 Z"
            fill="#080808"
            stroke="#444444"
            stroke-width="5"/>

      <path d="M104 7 L193 58 L193 104"
            fill="none"
            stroke="#ff2020"
            stroke-width="6"
            stroke-linecap="round"
            filter="url(#glow)"/>

      <path d="M193 125 L193 153 L104 207"
            fill="none"
            stroke="#b00000"
            stroke-width="5"
            stroke-linecap="round"
            filter="url(#glow)"/>

      <path d="M15 153 L15 58 L67 28"
            fill="none"
            stroke="#888888"
            stroke-width="5"
            stroke-linecap="round"/>

      <circle cx="104" cy="107" r="32" fill="url(#metal)"/>
      <circle cx="104" cy="107" r="14" fill="#090909"/>
    </g>

    <g transform="translate(142.5 21.5) scale(0.5)">
      <text x="0" y="76"
            font-family="Arial Black, sans-serif"
            font-size="78"
            font-weight="900"
            letter-spacing="5"
            fill="url(#metal)">Your</text>

      <text x="325" y="76"
            font-family="Arial Black, sans-serif"
            font-size="78"
            font-weight="900"
            letter-spacing="3"
            fill="url(#cyber)"
            filter="url(#smallGlow)">LOGO</text>

      <text x="3" y="151"
            font-family="Arial Black, sans-serif"
            font-size="72"
            font-weight="900"
            letter-spacing="11"
            fill="#ffffff">HERE!</text>

      <path d="M5 169 L580 169"
            stroke="#3a3a3a"
            stroke-width="8"/>

      <path d="M5 169 L365 169"
            stroke="url(#cyber)"
            stroke-width="5"
            stroke-linecap="round"
            filter="url(#smallGlow)"/>

      <text x="7" y="205"
            font-family="Arial, sans-serif"
            font-size="21"
            font-weight="700"
            letter-spacing="8"
            fill="#888888">YOUR ➜ SLOGAN ➜ HERE</text>
    </g>

    <g transform="translate(485 83) scale(0.5)">
      <path d="M0 0 L215 0 L198 59 L0 59 Z"
            fill="#090909"
            stroke="#444444"
            stroke-width="2"/>

      <path d="M0 0 L215 0"
            stroke="url(#cyber)"
            stroke-width="4"
            filter="url(#smallGlow)"/>

      <text x="26" y="39"
            font-family="Arial Black, sans-serif"
            font-size="22"
            font-weight="900"
            letter-spacing="3"
            fill="#ffffff">HOTLAPS</text>

      <circle cx="180" cy="30"
              r="5"
              fill="#ff2020"
              filter="url(#glow)"/>
    </g>

    <g font-family="Arial, sans-serif"
       font-size="5.7"
       font-weight="800"
       letter-spacing="1.5"
       fill="#666666">

      <text x="485" y="135">PLACEHOLDER SYSTEM</text>
      <text x="485" y="142">CUSTOMIZABLE AREA</text>
    </g>

    <g opacity="0.85">
      <path d="M410 29 L465 6"
            stroke="#ff2020"
            stroke-width="2"
            stroke-linecap="round"/>

      <path d="M425 36.5 L480 13.5"
            stroke="#888888"
            stroke-width="1.5"
            stroke-linecap="round"/>

      <path d="M440 44 L495 21"
            stroke="#666666"
            stroke-width="1"
            stroke-linecap="round"/>
    </g>

    <circle cx="562.5" cy="122.5"
            r="1.5"
            fill="#ff2020"
            filter="url(#smallGlow)"/>

    <circle cx="570" cy="122.5"
            r="1.5"
            fill="#888888"
            filter="url(#smallGlow)"/>

    <circle cx="577.5" cy="122.5"
            r="1.5"
            fill="#ffffff"
            filter="url(#smallGlow)"/>

  <rect x="1" y="1"
        width="598"
        height="148"
        rx="11"
        ry="11"
        fill="none"
        stroke="#303030"
        stroke-width="2"/>
</svg>
          </a>
          &nbsp;
          
          <div className="control-panel">
            <div className="panel-header-row">
              <div>
                <div className="live-indicator-wrapper">
                  <span className="live-dot"></span>
                  <span className="live-title">Live ACC Race Host - <span className="live-title-highlight">HOTLAP LEADERBOARD</span></span>
                </div>
                
                <div className="server-info-box">
                  <span className="server-label">Server name: </span>
                  <span className="server-text">{serverConfig.servername}</span>
                </div>
              </div>

          
            </div>
            
            {selectedTrack !== '' && (
              <div className="filter-row">
                <button onClick={() => setSelectedTrack('')} className="change-track-btn">
                  CHANGE TRACK
                </button>
                <div>
                  <label className="input-label">SEARCH DRIVER</label>
                  <input type="text" placeholder="ENTER DRIVER NAME..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="styled-input" />
                </div>
                <div>
                  <label className="input-label">SORT BY CLASS</label>
                  <select value={selectedClass} onChange={(e) => setSelectedClass(e.target.value)} className="styled-select">
                    <option value="ALL">🏆 ALL CLASSES</option>
                    <option value="GT3">GT3</option><option value="GT4">GT4</option><option value="GT2">GT2</option><option value="CUP">CUP</option><option value="ST">SUPER TROFEO</option>
                  </select>
                </div>
                <div>
                  <label className="input-label">WEATHER</label>
                  <select value={selectedWeather} onChange={(e) => setSelectedWeather(e.target.value)} className="styled-select">
                    <option value="DRY">☀️ DRY LAPS</option>
                    <option value="WET">🌧️ WET LAPS</option>
                  </select>
                </div>
                <div>
                  <label className="input-label">SWITCH CIRCUIT</label>
                  <select value={selectedTrack} onChange={(e) => setSelectedTrack(e.target.value)} className="styled-select">
                    {uniqueTracks.map(t => <option key={t} value={t}>📍 {TRACK_NAMES[t.toLowerCase()] || t.toUpperCase()}</option>)}
                  </select>
                </div>
              </div>
            )}
          </div>

          {selectedTrack === '' ? (
            <div className="track-grid">
              {uniqueTracks.map(trackKey => (
                <button 
                  key={trackKey} 
                  onClick={() => setSelectedTrack(trackKey)} 
                  className="track-card"
                >
                  <span className="circuit-tag">CIRCUIT</span>
                  <span className="track-name">
                    {TRACK_NAMES[trackKey.toLowerCase()] || trackKey.toUpperCase()}
                  </span>
                </button>
              ))}
            </div>
          ) : (
            <>
              {/* Dynamic Podium Grid */}
              {currentPage === 1 && searchQuery === '' && baselineUniqueLaps.length > 0 && (
                <div className="podium-grid">
                  {baselineUniqueLaps.slice(0, 3).map((lap, i) => {
                    const positions = [
                      { badge: '#ef4444', text: '🥇 P1 INTERVAL LEADER', bg: '#141414', border: '#ef4444', glow: '#ef4444', timerColor: '#ef4444' },
                      { badge: '#ef4444', text: '🥈 P2 PURSUING', bg: '#141414', border: '#e04444', glow: '#2c2c2c', timerColor: '#ffffff' },
                      { badge: '#ef4444', text: '🥉 P3 PURSUING', bg: '#141414', border: '#e04444', glow: '#2c2c2c', timerColor: '#ffffff' }
                    ][i];
                    return (
                      <div key={`podium-${lap.id}`} className="podium-card" style={{ backgroundColor: positions.bg, border: `1px solid ${positions.border}`, boxShadow: `0 0 20px ${positions.glow}` }}>
                        <div className="podium-header" style={{ color: positions.badge }}>{positions.text}</div>
                        <div onClick={() => setActiveDriverModal(lap.driver_name)} className="driver-link">
                          {lap.driver_name}
                        </div>
                        <div className="driver-meta">
                          <ClassBadge carModel={lap.car_model} />
                          {CAR_MODELS[lap.car_model] || `Car ID: ${lap.car_model}`}
                        </div>
                        <div className="track-label-mono">
                          TRACK: {TRACK_NAMES[lap.track?.toLowerCase()] || lap.track?.toUpperCase()}
                        </div>
                        <div style={{ marginBottom: '14px' }}>
                          <SectorSplitsDisplay splits={lap.best_splits} />
                        </div>
                        <div className="lap-timer-box" style={{ color: positions.timerColor }}>
                          <WeatherBadge wetlap={lap.wetlap} />
                          {formatLapTime(lap.best_lap_ms)}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              <div className="leaderboard-container">
                <table className="leaderboard-table">
                  <thead>
                    <tr className="leaderboard-header-row">
                      <th className="leaderboard-th th-pos">POS</th>
                      <th className="leaderboard-th">DRIVER</th>
                      <th className="leaderboard-th">CAR MODEL</th>
                      <th className="leaderboard-th th-right">DELTA</th>
                      <th className="leaderboard-th th-right">BEST LAP TIME</th>
                    </tr>
                  </thead>
                  <tbody>
                    {paginatedLaps.map((lap, index) => {
                      const absoluteIndex = startIndex + index;
                      const isActualFirst = lap.displayPosition === 1;
                      const { infoStr } = parseSessionId(lap.session_id);
                      return (
                        <tr key={lap.id} className="table-row" style={{ backgroundColor: isActualFirst ? '#9C1B1B' : (absoluteIndex % 2 === 0 ? '#141414' : '#2c2c2c') }}>
                          <td className="td-pos" style={{ color: isActualFirst ? '#ef4444' : '#ffffff', backgroundColor: isActualFirst ? 'rgba(49, 199, 205, 0.08)' : 'transparent', borderRight: isActualFirst ? '1px solid #ef4444' : 'none' }}>
                            {lap.displayPosition.toString().padStart(2, '0')}
                          </td>
                          <td className="td-default">
                            <span onClick={() => setActiveDriverModal(lap.driver_name)} className="table-driver-name">
                              {lap.driver_name}
                            </span>
                            <div className="session-info-text">
                              {infoStr}
                            </div>
                          </td>
                          <td className="td-car">
                            <ClassBadge carModel={lap.car_model} />{CAR_MODELS[lap.car_model] || `Car ID: ${lap.car_model}`}
                          </td>
                          <td className="td-delta" style={{ color: isActualFirst ? '#ef4444' : '#ea06ed' }}>{formatDelta(lap.best_lap_ms, p1Time)}</td>
                          <td className="td-lap" style={{ color: isActualFirst ? '#ef4444' : '#ffffff' }}>
                            <div><WeatherBadge wetlap={lap.wetlap} />{formatLapTime(lap.best_lap_ms)}</div>
                            <SectorSplitsDisplay splits={lap.best_splits} align="right" />
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>

                {/* PAGINATION CONTROLS */}
                {totalPages > 1 && (
                  <div className="pagination-bar">
                    <div className="pagination-info">
                      SHOWING {startIndex + 1} - {Math.min(startIndex + ITEMS_PER_PAGE, finalFilteredLaps.length)} OF {finalFilteredLaps.length} DRIVERS
                    </div>
                    <div className="pagination-buttons">
                      <button 
                        onClick={() => setCurrentPage(p => Math.max(p - 1, 1))} 
                        disabled={currentPage === 1}
                        className="page-btn"
                        style={{ backgroundColor: currentPage === 1 ? '#2c2c2c' : '#2f2f2f', color: currentPage === 1 ? '#555' : '#ef4444', cursor: currentPage === 1 ? 'not-allowed' : 'pointer' }}
                      >
                        PREV
                      </button>
                      <span className="page-indicator">PAGE {currentPage} OF {totalPages}</span>
                      <button 
                        onClick={() => setCurrentPage(p => Math.min(p + 1, totalPages))} 
                        disabled={currentPage === totalPages}
                        className="page-btn"
                        style={{ backgroundColor: currentPage === totalPages ? '#2c2c2c' : '#2f2f2f', color: currentPage === totalPages ? '#555' : '#ef4444', cursor: currentPage === totalPages ? 'not-allowed' : 'pointer' }}
                      >
                        NEXT
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </>
          )}

          {/* DRIVER PROFILE MODAL POPUP */}
          {driverStats && (
            <div className="modal-overlay" onClick={() => setActiveDriverModal(null)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header-flex">
                  <div>
                    <div className="modal-subtitle">DRIVER TELEMETRY PROFILE</div>
                    <h2 className="modal-title">{driverStats.name}</h2>
                  </div>
                  <button onClick={() => setActiveDriverModal(null)} className="modal-close-btn">
                    ✕
                  </button>
                </div>

                <div className="modal-grid">
                  <div className="modal-stat-box">
                    <div className="modal-stat-label">POSITION</div>
                    <div className="modal-stat-value" style={{ color: '#ef4444', fontWeight: 'bold' }}>P{driverStats.position}</div>
                  </div>
                  <div className="modal-stat-box">
                    <div className="modal-stat-label">BEST LAP</div>
                    <div className="modal-stat-value" style={{ color: '#ffffff', display: 'flex', alignItems: 'center' }}>
                      <WeatherBadge wetlap={driverStats.wetlap} />
                      {formatLapTime(driverStats.bestLapMs)}
                    </div>
                  </div>
                  <div className="modal-stat-box">
                    <div className="modal-stat-label">DELTA TO P1</div>
                    <div className="modal-stat-value" style={{ color: '#ea06ed' }}>{driverStats.delta}</div>
                  </div>
                  <div className="modal-stat-box">
                    <div className="modal-stat-label">SESSIONS RECORDED</div>
                    <div className="modal-stat-value" style={{ color: '#ffffff' }}>{driverStats.totalSessions}</div>
                  </div>
                </div>

                <div className="modal-stat-box" style={{ marginBottom: '12px' }}>
                  <div className="modal-stat-label" style={{ marginBottom: '6px' }}>BEST SECTOR SPLITS</div>
                  <SectorSplitsDisplay splits={driverStats.bestSplits} align="left" />
                </div>

                <div className="modal-cars-box">
                  <div className="modal-stat-label" style={{ marginBottom: '6px' }}>CARS DRIVEN</div>
                  <div className="modal-cars-text">
                    {driverStats.carsDriven.join(', ')}
                  </div>
                </div>

                <button onClick={() => setActiveDriverModal(null)} className="modal-action-btn">
                  CLOSE PROFILE
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
