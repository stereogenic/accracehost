<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACC Race Host - Hotlap Live Leaderboard</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #05060b;
      --card: #0a0d14;
      --text: #dbe7f5;
      --accent: #5b8cff;
      --accent-hover: #7651d8;
      --border: #202a3a;
      --bg-black: #020308;
      --bg-panel: #0b101a;
      --bg-input: #080c14;
      --border-neutral: #1c2635;
      --border-hover: #5b8cff;
      --text-main: #f4f8ff;
      --text-muted: #7f91a8;
      --accent-red: #ff27d9;
      --accent-red-hover: #ff5be7;
      --accent-cyan: #5b8cff;
      --accent-emerald: #39ffb6;
      --cyber-cyan: #4b8cff;
      --cyber-blue: #3867ff;
      --cyber-violet: #8b5cff;
      --cyber-pink: #ff27c8;
      --cyber-green: #39ffb6;
      --cyber-line: rgba(0, 229, 255, 0.28);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px 15px;
      background-color: #05060b;
      background-image:
        linear-gradient(rgba(91,140,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,77,255,0.025) 1px, transparent 1px),
        radial-gradient(circle at 50% -10%, rgba(91,140,255,0.12), transparent 38%),
        radial-gradient(circle at 100% 80%, rgba(255,39,217,0.07), transparent 35%);
      background-size: 32px 32px, 32px 32px, auto, auto;
      background-attachment: fixed;
      color: var(--text);
      font-size: 13px;
      display: flex;
      justify-content: center;
    }

    #app {
      width: 100%;
      max-width: 1100px;
    }

    ::-webkit-scrollbar { width: 8px; height: 10px; }
    ::-webkit-scrollbar-track { background: #050811; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #17364d, #26315d); border: 1px solid #31506d; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: linear-gradient(90deg, #5b8cff, #7651d8 55%, #ff27d9); }

    a { color: #6f8dff; text-decoration: none; text-shadow: 0 0 8px rgba(91,140,255,0.15); }
    a:hover { color: var(--cyber-pink); }

    .card, .script-controls, .telemetry-tile, .modal-box {
      background: linear-gradient(135deg, rgba(12,18,30,0.97), rgba(5,8,15,0.97));
      border: 1px solid #20334a;
      border-radius: 3px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.025), 0 0 0 1px rgba(91,140,255,0.025), 0 8px 28px rgba(0,0,0,0.38);
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 18px;
      right: 55%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #7651d8, #ff27c8, transparent);
      opacity: 0.9;
    }

    h1 {
      margin: 0;
      font-family: 'Teko', sans-serif;
      font-size: 52px;
      font-weight: bold;
      color: #ffffff;
      text-transform: uppercase;
      font-style: italic;
      line-height: 1;
      letter-spacing: 0.04em;
      text-shadow: 0 0 12px rgba(91,140,255,0.22);
    }

    label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      display: block;
    }

    input, select {
      background: #090e17;
      border: 1px solid #26384f;
      color: white;
      padding: 4px 8px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 13px;
      height: 32px;
      box-sizing: border-box;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    input:hover, select:hover { border-color: #3d5f82; }
    input:focus, select:focus { border-color: #7651d8; outline: none; box-shadow: 0 0 0 1px rgba(91,140,255,0.18), 0 0 14px rgba(91,140,255,0.12); }

    button {
      padding: 6px 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      transition: all 0.18s ease;
    }

    button:hover {
      background: linear-gradient(90deg, #5b8cff, #7651d8 55%, #ff27d9);
      box-shadow: 0 0 18px rgba(91,140,255,0.24);
      transform: translateY(-1px);
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

    .track-btn {
      background: linear-gradient(135deg, rgba(12,18,30,0.97), rgba(5,8,15,0.97));
      border: 1px solid #20334a;
      padding: 18px 20px;
      text-align: left;
      cursor: pointer;
      height: 100px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.15s ease;
      border-radius: 3px;
    }
    .track-btn:hover {
      border-color: #ff27c8;
      background: linear-gradient(135deg, rgba(25,17,51,0.97), rgba(10,13,20,0.97));
      transform: translateY(-2px);
      box-shadow: 0 0 18px rgba(255,39,200,0.15);
    }

    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { border-bottom: 1px solid #26384f; color: #7890ab; padding: 16px 20px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; }
    td { border-bottom: 1px solid #172536; padding: 16px 20px; }
    tr:hover td { background: rgba(91,140,255,0.025); }
  </style>
</head>
<body style="margin: 0;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = '__SUPABASE_URL_PLACEHOLDER__';
    const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY_PLACEHOLDER__';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function formatLapTime(ms) {
      if (!ms || ms === 2147483647) return '——';
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const milliseconds = ms % 1000;
      return `${minutes}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
    }

    function formatSectorTime(ms) {
      if (!ms || ms === 2147483647) return '——';
      const seconds = Math.floor(ms / 1000);
      const millis = ms % 1000;
      return `${seconds}.${millis.toString().padStart(3, '0')}`;
    }

    function formatDelta(currentMs, p1Ms) {
      if (!currentMs || !p1Ms || currentMs === p1Ms) return '——';
      const diff = currentMs - p1Ms;
      const seconds = (diff / 1000).toFixed(3);
      return `+${seconds}s`;
    }

    function WeatherBadge({ wetlap }) {
      const isWet = String(wetlap).toLowerCase() === 'wet' || wetlap === true;
      return (
        <span title={isWet ? 'Wet Session' : 'Dry Session'} style={{ marginRight: '6px', fontSize: '15px', verticalAlign: 'middle' }}>
          {isWet ? '🌧️' : '☀️'}
        </span>
      );
    }

    function SectorSplitsDisplay({ splits, align = 'left' }) {
      if (!splits || !Array.isArray(splits) || splits.length === 0) return null;
      return (
        <div style={{ display: 'flex', justifyContent: align === 'right' ? 'flex-end' : 'flex-start', gap: '5px', flexWrap: 'wrap', marginTop: '4px' }}>
          {splits.map((splitMs, idx) => (
            <span key={idx} style={{ backgroundColor: '#05060b', border: '1px solid #7651d8', color: '#5b8cff', fontSize: '10px', fontFamily: 'monospace', padding: '1px 5px', borderRadius: '2px', textShadow: '0 0 6px rgba(91,140,255,0.2)' }}>
              <span style={{ color: '#7f91a8', fontSize: '9px', marginRight: '3px' }}>S{idx + 1}</span>
              {formatSectorTime(splitMs)}
            </span>
          ))}
        </div>
      );
    }

    const TRACK_NAMES = {
      'barcelona': 'Barcelona', 'brands_hatch': 'Brands Hatch', 'circuit_of_the_americas': 'COTA',
      'donington': 'Donington Park', 'hungaroring': 'Hungaroring', 'indianapolis': 'Indianapolis',
      'kyalami': 'Kyalami', 'laguna_seca': 'Laguna Seca', 'misano': 'Misano', 'monza': 'Monza Circuit',
      'mount_panorama': 'Bathurst', 'nurburgring': 'Nürburgring', 'nurburgring_24h': 'Nordschleife',
      'oulton_park': 'Oulton Park', 'paul_ricard': 'Paul Ricard', 'red_bull_ring': 'Red Bull Ring',
      'silverstone': 'Silverstone', 'snetterton': 'Snetterton', 'spa': 'Spa-Francorchamps',
      'suzuka': 'Suzuka', 'valencia': 'Valencia', 'watkins_glen': 'Watkins Glen', 'zandvoort': 'Zandvoort', 'zolder': 'Zolder'
    };

    const CAR_CLASSES = {
      '0': 'GT3', '1': 'GT3', '2': 'GT3', '3': 'GT3', '4': 'GT3', '5': 'GT3', '6': 'GT3', '7': 'GT3', '8': 'GT3', '9': 'CUP',
      '10': 'GT3', '11': 'GT3', '12': 'GT3', '13': 'GT3', '14': 'GT3', '15': 'GT3', '16': 'GT3', '17': 'GT3', '18': 'ST',
      '19': 'GT3', '20': 'GT3', '21': 'GT3', '22': 'GT3', '23': 'GT3', '24': 'GT3', '25': 'GT3', '26': 'CH', '27': 'TC', '28': 'CUP', '29': 'ST',
      '30': 'GT3', '31': 'TC', '32': 'GT3', '33': 'GT3', '34': 'GT3', '35': 'GT3', '36': 'GT3', 
      '50': 'GT4', '51': 'GT4', '52': 'GT4', '53': 'GT4', '55': 'GT4', '56': 'GT4', '57': 'GT4', '58': 'GT4', '59': 'GT4', '60': 'GT4', '61': 'GT4', 
      '80': 'GT2', '82': 'GT2', '83': 'GT2', '84': 'GT2', '85': 'GT2', '86': 'GT2'
    };

    const CLASS_COLORS = {
      'GT3': { bg: 'rgba(255, 39, 217, 0.1)', border: '#ff27d9', text: '#ff5be7' },
      'GT4': { bg: 'rgba(91, 140, 255, 0.1)', border: '#5b8cff', text: '#93c5fd' },
      'GT2': { bg: 'rgba(57, 255, 182, 0.1)', border: '#39ffb6', text: '#6ee7b7' },
      'CUP': { bg: 'rgba(245, 158, 11, 0.1)', border: '#f59e0b', text: '#fde047' },
      'ST': { bg: 'rgba(139, 92, 246, 0.1)', border: '#8b5cf6', text: '#c4b5fd' },
      'CH': { bg: 'rgba(236, 72, 153, 0.1)', border: '#ec4899', text: '#fbcfe8' },
      'TC': { bg: 'rgba(107, 114, 128, 0.1)', border: '#6b7280', text: '#d1d5db' }
    };

    function ClassBadge({ carModel }) {
      const cls = CAR_CLASSES[String(carModel)] || 'OTHERS'; 
      const colors = CLASS_COLORS[cls] || { bg: 'rgba(17, 24, 39, 0.5)', border: '#374151', text: '#9ca3af' };
      return (
        <span style={{ display: 'inline-block', padding: '2px 6px', fontSize: '10px', fontWeight: 'bold', fontFamily: 'monospace', backgroundColor: colors.bg, border: `1px solid ${colors.border}`, color: colors.text, borderRadius: '3px', marginRight: '8px', textTransform: 'uppercase', verticalAlign: 'middle' }}>
          {cls}
        </span>
      );
    }

    const CAR_MODELS = {
      '0': 'Porsche 991 GT3 R', '1': 'Mercedes-AMG GT3 (2015)', '2': 'Ferrari 488 GT3', '3': 'Audi R8 LMS', '4': 'Lamborghini Huracán GT3',
      '5': 'McLaren 650S GT3', '6': 'Nissan GT-R NISMO GT3 (2018)', '7': 'BMW M6 GT3', '8': 'Bentley Continental GT3 (2018)', '9': 'Porsche 991 II GT3 Cup',
      '10': 'Nissan GT-R NISMO GT3 (2017)', '11': 'Bentley Continental GT3 (2016)', '12': 'Aston Martin V12 Vantage GT3', '13': 'Lamborghini Gallardo R-EX',
      '14': 'Jaguar G3', '15': 'Lexus RC F GT3', '16': 'Lamborghini Huracán GT3 Evo', '17': 'Honda NSX GT3', '18': 'Lamborghini Huracán Super Trofeo',
      '19': 'Audi R8 LMS Evo', '20': 'Aston Martin V8 Vantage GT3', '21': 'Honda NSX GT3 Evo', '22': 'McLaren 720S GT3', '23': 'Porsche 991.2 GT3 R',
      '24': 'Ferrari 488 GT3 Evo', '25': 'Mercedes-AMG GT3 Evo', '26': 'Ferrari 488 Challenge Evo', '27': 'BMW M2 CS Racing', '28': 'Porsche 992 GT3 Cup',
      '29': 'Lamborghini Huracán Super Trofeo EVO2', '30': 'BMW M4 GT3', '31': 'Audi R8 LMS Evo II', '32': 'Ferrari 296 GT3', '33': 'Lamborghini Huracán GT3 EVO2',
      '34': 'Porsche 992 GT3 R', '35': 'McLaren 720S GT3 Evo', '36': 'Ford Mustang GT3', '50': 'Alpine A110 GT4', '51': 'Aston Martin Vantage GT4',
      '52': 'Audi R8 LMS GT4', '53': 'BMW M4 GT4', '55': 'Chevrolet Camaro GT4.R', '56': 'Ginetta G55 GT4', '57': 'KTM X-Bow GT4', '58': 'Maserati MC GT4',
      '59': 'McLaren 570S GT4', '60': 'Mercedes-AMG GT4', '61': 'Porsche 718 Cayman GT4 Clubsport', '80': 'Audi R8 LMS GT2', '82': 'KTM X-Bow GT2',
      '83': 'Maserati MC20 GT2', '84': 'Mercedes-AMG GT2', '85': 'Porsche 911 GT2 RS Clubsport Evo', '86': 'Porsche 935'
    };

    function App() {
      const [uniqueTracks, setUniqueTracks] = useState([]);
      const [queryData, setQueryData] = useState([]);
      const [selectedTrack, setSelectedTrack] = useState(''); 
      const [selectedClass, setSelectedClass] = useState('ALL'); 
      const [selectedWeather, setSelectedWeather] = useState('DRY'); 
      const [searchQuery, setSearchQuery] = useState(''); 
      const [currentPage, setCurrentPage] = useState(1); 
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeDriverModal, setActiveDriverModal] = useState(null);

      const ITEMS_PER_PAGE = 25;

      useEffect(() => { setCurrentPage(1); }, [selectedTrack, selectedClass, selectedWeather, searchQuery]);

      useEffect(() => {
        async function fetchTracksList() {
          try {
            const { data, error } = await supabase.rpc('get_unique_tracks');
            if (error) throw error;
            if (!data || data.length === 0) { setUniqueTracks([]); return; }
            const tracks = data.map(item => item.track ? String(item.track).trim().toLowerCase() : null).filter(Boolean);
            setUniqueTracks(tracks.sort());
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        }
        fetchTracksList();
      }, []);

      useEffect(() => {
        if (!selectedTrack) { setQueryData([]); return; }
        async function fetchFilteredLaps() {
          setLoading(true);
          try {
            let query = supabase.from('hotlaps').select('*').ilike('track', selectedTrack).order('best_lap_ms', { ascending: true }).range(0, 4999);
            if (selectedClass !== 'ALL') {
              const targetCarIds = Object.keys(CAR_CLASSES).filter(key => CAR_CLASSES[key] === selectedClass);
              query = query.in('car_model', [...targetCarIds, ...targetCarIds.map(id => Number(id))]);
            }
            if (selectedWeather === 'DRY') query = query.or('wetlap.ilike.dry,wetlap.eq.false');
            else if (selectedWeather === 'WET') query = query.or('wetlap.ilike.wet,wetlap.eq.true');

            const { data, error } = await query;
            if (error) throw error;
            setQueryData(data || []);
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        }
        fetchFilteredLaps();
      }, [selectedTrack, selectedClass, selectedWeather]);

      if (loading && uniqueTracks.length === 0) {
        return <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100vh', backgroundColor: '#05060b', color: '#5b8cff' }}><code>🏁 LOADING TELEMETRY ENGINE...</code></div>;
      }
      if (error) {
        return <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100vh', backgroundColor: '#05060b', color: '#ff27d9' }}><code>🏁 RACE CONTROL ERROR: {error}</code></div>;
      }

      const seenDrivers = new Set();
      const baselineUniqueLaps = queryData.filter(lap => {
        if (seenDrivers.has(lap.driver_name)) return false;
        seenDrivers.add(lap.driver_name);
        return true;
      });

      const lapsWithDisplayPosition = baselineUniqueLaps.map((lap, index) => ({ ...lap, displayPosition: index + 1 }));
      const finalFilteredLaps = lapsWithDisplayPosition.filter(lap => lap.driver_name?.toLowerCase().includes(searchQuery.toLowerCase()));
      const p1Time = baselineUniqueLaps[0]?.best_lap_ms;
      const totalPages = Math.ceil(finalFilteredLaps.length / ITEMS_PER_PAGE);
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const paginatedLaps = finalFilteredLaps.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      const getDriverStats = (driverName) => {
        if (!driverName) return null;
        const driverLaps = queryData.filter(l => l.driver_name === driverName);
        const bestLap = driverLaps[0];
        const position = baselineUniqueLaps.findIndex(l => l.driver_name === driverName) + 1;
        return {
          name: driverName, bestLapMs: bestLap?.best_lap_ms, 
          totalSessions: driverLaps.length, position: position > 0 ? position : 'N/A',
          delta: formatDelta(bestLap?.best_lap_ms, p1Time), wetlap: bestLap?.wetlap
        };
      };
      const driverStats = activeDriverModal ? getDriverStats(activeDriverModal) : null;

      return (
        <div id="app">
          <div className="card" style={{ padding: '22px 28px', marginBottom: '25px', borderLeft: '4px solid #ff27d9' }}>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%' }}>
                <div>
                  <h1>
                    ACC <span style={{ color: '#5b8cff', textShadow: '0 0 10px rgba(91,140,255,0.3)' }}>RACE HOST</span>
                  </h1>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginTop: '6px' }}>
                    <span style={{ height: '7px', width: '7px', backgroundColor: '#39ffb6', borderRadius: '50%', display: 'inline-block', boxShadow: '0 0 8px #39ffb6' }}></span>
                    <span style={{ fontSize: '12px', fontWeight: 'bold', fontFamily: 'monospace', color: '#ff27d9', letterSpacing: '0.22em', textShadow: '0 0 8px rgba(255,39,217,0.3)' }}>HOTLAP LIVE LEADERBOARD</span>
                  </div>
                </div>
              </div>
              
              {selectedTrack !== '' && (
                <div style={{ display: 'flex', alignItems: 'flex-end', width: '100%', flexWrap: 'wrap', gap: '15px' }}>
                  <button onClick={() => setSelectedTrack('')} style={{ marginRight: 'auto', backgroundColor: '#0b101a', color: '#5b8cff', border: '1px solid #5b8cff' }}>
                    ← CHANGE TRACK
                  </button>
                  <div>
                    <label>SEARCH DRIVER</label>
                    <input type="text" placeholder="DRIVER NAME..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} style={{ width: '170px' }} />
                  </div>
                  <div>
                    <label>SORT BY CLASS</label>
                    <select value={selectedClass} onChange={(e) => setSelectedClass(e.target.value)} style={{ cursor: 'pointer' }}>
                      <option value="ALL">🏆 ALL CLASSES</option>
                      <option value="GT3">GT3</option><option value="GT4">GT4</option><option value="GT2">GT2</option><option value="CUP">CUP</option><option value="ST">SUPER TROFEO</option>
                    </select>
                  </div>
                  <div>
                    <label>WEATHER</label>
                    <select value={selectedWeather} onChange={(e) => setSelectedWeather(e.target.value)} style={{ cursor: 'pointer' }}>
                      <option value="DRY">☀️ DRY LAPS</option>
                      <option value="WET">🌧️ WET LAPS</option>
                    </select>
                  </div>
                  <div>
                    <label>SWITCH CIRCUIT</label>
                    <select value={selectedTrack} onChange={(e) => setSelectedTrack(e.target.value)} style={{ cursor: 'pointer' }}>
                      {uniqueTracks.map(t => <option key={t} value={t}>📍 {TRACK_NAMES[t.toLowerCase()] || t.toUpperCase()}</option>)}
                    </select>
                  </div>
                </div>
              )}
            </div>
          </div>

          {selectedTrack === '' ? (
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: '15px' }}>
              {uniqueTracks.map(trackKey => (
                <button 
                  key={trackKey} 
                  onClick={() => setSelectedTrack(trackKey)} 
                  className="track-btn"
                >
                  <span style={{ fontSize: '10px', color: '#5b8cff', fontFamily: 'monospace', letterSpacing: '0.1em' }}>CIRCUIT</span>
                  <span style={{ fontSize: '17px', fontWeight: 'bold', color: '#ffffff', fontStyle: 'italic', textTransform: 'uppercase' }}>
                    {TRACK_NAMES[trackKey.toLowerCase()] || trackKey.toUpperCase()}
                  </span>
                </button>
              ))}
            </div>
          ) : (
            <>
              {/* Podium Section */}
              {currentPage === 1 && searchQuery === '' && baselineUniqueLaps.length > 0 && (
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '20px', marginBottom: '30px' }}>
                  {baselineUniqueLaps.slice(0, 3).map((lap, i) => {
                    const positions = [
                      { badge: '#5b8cff', text: '🥇 P1 INTERVAL LEADER', border: '#5b8cff', glow: 'rgba(91, 140, 255, 0.2)' },
                      { badge: '#ff27d9', text: '🥈 P2 PURSUING', border: '#ff27d9', glow: 'rgba(255, 39, 217, 0.15)' },
                      { badge: '#8b5cf6', text: '🥉 P3 PURSUING', border: '#8b5cf6', glow: 'rgba(139, 92, 246, 0.15)' }
                    ][i];
                    return (
                      <div key={`podium-${lap.id}`} className="card" style={{ border: `1px solid ${positions.border}`, padding: '20px', boxShadow: `0 0 20px ${positions.glow}` }}>
                        <div style={{ color: positions.badge, fontSize: '11px', fontFamily: 'monospace', marginBottom: '10px', letterSpacing: '0.12em' }}>{positions.text}</div>
                        <div onClick={() => setActiveDriverModal(lap.driver_name)} style={{ fontSize: '22px', color: '#ffffff', fontStyle: 'italic', textTransform: 'uppercase', cursor: 'pointer', transition: 'color 0.2s' }}
                          onMouseEnter={(e) => e.currentTarget.style.color = '#5b8cff'}
                          onMouseLeave={(e) => e.currentTarget.style.color = '#ffffff'}
                        >
                          {lap.driver_name}
                        </div>
                        <div style={{ fontSize: '12px', color: '#7f91a8', margin: '4px 0 10px 0', display: 'flex', alignItems: 'center' }}>
                          <ClassBadge carModel={lap.car_model} />
                          {CAR_MODELS[lap.car_model] || `Car ID: ${lap.car_model}`}
                        </div>
                        <div style={{ fontSize: '11px', color: '#5b8cff', fontFamily: 'monospace', marginBottom: '10px' }}>
                          TRACK: {TRACK_NAMES[lap.track?.toLowerCase()] || lap.track?.toUpperCase()}
                        </div>
                        <div style={{ marginBottom: '14px' }}>
                          <SectorSplitsDisplay splits={lap.best_splits} />
                        </div>
                        <div style={{ fontSize: '26px', fontFamily: 'monospace', color: '#ffffff', textAlign: 'right', backgroundColor: '#05060b', padding: '6px 12px', border: '1px solid #202a3a', display: 'flex', alignItems: 'center', justifyContent: 'flex-end', textShadow: '0 0 10px rgba(255,255,255,0.1)' }}>
                          <WeatherBadge wetlap={lap.wetlap} />
                          {formatLapTime(lap.best_lap_ms)}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}

              {/* Leaderboard Table Container */}
              <div className="card" style={{ padding: 0, overflow: 'hidden' }}>
                <table>
                  <thead>
                    <tr>
                      <th style={{ width: '70px' }}>POS</th>
                      <th>DRIVER</th>
                      <th>CAR MODEL</th>
                      <th style={{ textAlign: 'right' }}>DELTA</th>
                      <th style={{ textAlign: 'right' }}>BEST LAP TIME</th>
                    </tr>
                  </thead>
                  <tbody>
                    {paginatedLaps.map((lap, index) => {
                      const absoluteIndex = startIndex + index;
                      const isActualFirst = lap.displayPosition === 1;
                      return (
                        <tr key={lap.id} style={{ backgroundColor: isActualFirst ? 'rgba(91, 140, 255, 0.04)' : 'transparent' }}>
                          <td style={{ color: isActualFirst ? '#5b8cff' : '#8b5cf6', fontSize: '16px', fontStyle: 'italic', fontWeight: 'bold', verticalAlign: 'top' }}>
                            {lap.displayPosition.toString().padStart(2, '0')}
                          </td>
                          <td style={{ fontStyle: 'italic', verticalAlign: 'top' }}>
                            <span onClick={() => setActiveDriverModal(lap.driver_name)} style={{ color: '#ffffff', textTransform: 'uppercase', fontSize: '12px', cursor: 'pointer', transition: 'color 0.2s' }}
                              onMouseEnter={(e) => e.currentTarget.style.color = '#5b8cff'}
                              onMouseLeave={(e) => e.currentTarget.style.color = '#ffffff'}
                            >
                              {lap.driver_name}
                            </span>
                          </td>
                          <td style={{ color: '#a0afc0', fontSize: '13px', verticalAlign: 'top' }}>
                            <ClassBadge carModel={lap.car_model} />{CAR_MODELS[lap.car_model] || `Car ID: ${lap.car_model}`}
                          </td>
                          <td style={{ textAlign: 'right', color: isActualFirst ? '#5b8cff' : '#ff27d9', fontFamily: 'monospace', verticalAlign: 'top' }}>{formatDelta(lap.best_lap_ms, p1Time)}</td>
                          <td style={{ textAlign: 'right', fontFamily: 'monospace', fontSize: '16px', color: isActualFirst ? '#5b8cff' : '#ffffff', verticalAlign: 'top' }}>
                            <div><WeatherBadge wetlap={lap.wetlap} />{formatLapTime(lap.best_lap_ms)}</div>
                            <SectorSplitsDisplay splits={lap.best_splits} align="right" />
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>

                {/* PAGINATION CONTROLS */}
                {totalPages > 1 && (
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '16px 20px', backgroundColor: '#03040a', borderTop: '1px solid #202a3a', fontFamily: 'monospace', fontSize: '12px' }}>
                    <div style={{ color: '#7f91a8' }}>
                      SHOWING {startIndex + 1} - {Math.min(startIndex + ITEMS_PER_PAGE, finalFilteredLaps.length)} OF {finalFilteredLaps.length} DRIVERS
                    </div>
                    <div style={{ display: 'flex', gap: '8px' }}>
                      <button 
                        onClick={() => setCurrentPage(p => Math.max(p - 1, 1))} 
                        disabled={currentPage === 1}
                      >
                        PREV
                      </button>
                      <span style={{ padding: '6px 10px', color: '#ffffff' }}>PAGE {currentPage} OF {totalPages}</span>
                      <button 
                        onClick={() => setCurrentPage(p => Math.min(p + 1, totalPages))} 
                        disabled={currentPage === totalPages}
                      >
                        NEXT
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </>
          )}

          {/* DRIVER PROFILE MODAL */}
          {driverStats && (
            <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(5, 6, 11, 0.85)', backdropFilter: 'blur(4px)', display: 'flex', justifyContent: 'center', alignItems: 'center', zIndex: 1000, padding: '20px' }} onClick={() => setActiveDriverModal(null)}>
              <div className="card" style={{ padding: '28px', maxWidth: '480px', width: '100%', borderTop: '4px solid #5b8cff', boxShadow: '0 0 35px rgba(91, 140, 255, 0.25)' }} onClick={(e) => e.stopPropagation()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '20px' }}>
                  <div>
                    <div style={{ fontSize: '11px', color: '#5b8cff', fontFamily: 'monospace', letterSpacing: '0.15em' }}>DRIVER TELEMETRY PROFILE</div>
                    <h2 style={{ margin: '4px 0 0 0', fontSize: '26px', color: '#ffffff', fontStyle: 'italic', textTransform: 'uppercase' }}>{driverStats.name}</h2>
                  </div>
                  <button onClick={() => setActiveDriverModal(null)} style={{ background: 'transparent', color: '#ff27d9', border: 'none', fontSize: '20px', cursor: 'pointer', boxShadow: 'none' }}>✕</button>
                </div>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '20px' }}>
                  <div style={{ backgroundColor: '#05060b', padding: '12px', border: '1px solid #202a3a' }}>
                    <div style={{ fontSize: '10px', color: '#7f91a8', fontFamily: 'monospace' }}>POSITION</div>
                    <div style={{ fontSize: '20px', color: '#5b8cff', fontFamily: 'monospace', fontWeight: 'bold' }}>P{driverStats.position}</div>
                  </div>
                  <div style={{ backgroundColor: '#05060b', padding: '12px', border: '1px solid #202a3a' }}>
                    <div style={{ fontSize: '10px', color: '#7f91a8', fontFamily: 'monospace' }}>BEST LAP</div>
                    <div style={{ fontSize: '20px', color: '#ffffff', fontFamily: 'monospace', display: 'flex', alignItems: 'center' }}>
                      <WeatherBadge wetlap={driverStats.wetlap} />{formatLapTime(driverStats.bestLapMs)}
                    </div>
                  </div>
                </div>
                <button onClick={() => setActiveDriverModal(null)} style={{ width: '100%', backgroundColor: '#0b101a', color: '#5b8cff', border: '1px solid #5b8cff' }}>CLOSE PROFILE</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
