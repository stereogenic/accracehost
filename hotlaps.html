    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function formatLapTime(ms) {
      if (!ms || ms === 2147483647) return '——';
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.floor((ms % 60000) / 1000);
      const milliseconds = ms % 1000;
      return `${minutes}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
    }

    function formatSectorTime(ms) {
      if (!ms || ms === 2147483647) return '——';
      const seconds = Math.floor(ms / 1000);
      const millis = ms % 1000;
      return `${seconds}.${millis.toString().padStart(3, '0')}`;
    }

    function formatDelta(currentMs, p1Ms) {
      if (!currentMs || !p1Ms || currentMs === p1Ms) return '——';
      const diff = currentMs - p1Ms;
      const seconds = (diff / 1000).toFixed(3);
      return `+${seconds}s`;
    }

    function WeatherBadge({ wetlap }) {
      const isWet = String(wetlap).toLowerCase() === 'wet' || wetlap === true;
      return (
        <span title={isWet ? 'Wet Session' : 'Dry Session'} style={{ marginRight: '6px', fontSize: '15px', verticalAlign: 'middle' }}>
          {isWet ? '🌧️' : '☀️'}
        </span>
      );
    }

    function SectorSplitsDisplay({ splits, align = 'left' }) {
      if (!splits || !Array.isArray(splits) || splits.length === 0) return null;
      return (
        <div style={{ display: 'flex', justifyContent: align === 'right' ? 'flex-end' : 'flex-start', gap: '5px', flexWrap: 'wrap', marginTop: '4px' }}>

            <span key={idx} style={{ backgroundColor: '#0a0812', border: '1px solid #914cf2', color: '#06f5ff', fontSize: '10px', fontFamily: 'monospace', padding: '1px 5px', borderRadius: '2px' }}>
              <span style={{ color: '#a0a0c0', fontSize: '9px', marginRight: '3px' }}>S{idx + 1}</span>
              {formatSectorTime(splitMs)}
            </span>
          ))}
        </div>
      );
    }

    function App() {
      const [uniqueTracks, setUniqueTracks] = useState([]);
      const [queryData, setQueryData] = useState([]);
      const [selectedTrack, setSelectedTrack] = useState(''); 
      const [selectedClass, setSelectedClass] = useState('ALL'); 
      const [selectedWeather, setSelectedWeather] = useState('DRY'); 
      const [searchQuery, setSearchQuery] = useState(''); 
      const [currentPage, setCurrentPage] = useState(1); 
      const [error, setError] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeDriverModal, setActiveDriverModal] = useState(null);

      const ITEMS_PER_PAGE = 25;

      useEffect(() => { setCurrentPage(1); }, [selectedTrack, selectedClass, selectedWeather, searchQuery]);

      useEffect(() => {
        async function fetchTracksList() {
          try {
            const { data, error } = await supabase.rpc('get_unique_tracks');
            if (error) throw error;
            if (!data || data.length === 0) { setUniqueTracks([]); return; }
            const tracks = data.map(item => item.track ? String(item.track).trim().toLowerCase() : null).filter(Boolean);
            setUniqueTracks(tracks.sort());
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        }
        fetchTracksList();
      }, []);

      useEffect(() => {
        if (!selectedTrack) { setQueryData([]); return; }
        async function fetchFilteredLaps() {
          setLoading(true);
          try {
            let query = supabase.from('hotlaps').select('*').ilike('track', selectedTrack).order('best_lap_ms', { ascending: true }).range(0, 4999);
            if (selectedClass !== 'ALL') {
              const targetCarIds = Object.keys(CAR_CLASSES).filter(key => CAR_CLASSES[key] === selectedClass);
              query = query.in('car_model', [...targetCarIds, ...targetCarIds.map(id => Number(id))]);
            }
            if (selectedWeather === 'DRY') query = query.or('wetlap.ilike.dry,wetlap.eq.false');
            else if (selectedWeather === 'WET') query = query.or('wetlap.ilike.wet,wetlap.eq.true');

            const { data, error } = await query;
            if (error) throw error;
            setQueryData(data || []);
          } catch (err) {
            setError(err.message);
          } finally {
            setLoading(false);
          }
        }
        fetchFilteredLaps();
      }, [selectedTrack, selectedClass, selectedWeather]);

      if (loading && uniqueTracks.length === 0) {
        return <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100vh', backgroundColor: '#0a0812', color: '#06f5ff' }}><code>🏁 LOADING TELEMETRY ENGINE...</code></div>;
      }
      if (error) {
        return <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100vh', backgroundColor: '#0a0812', color: '#ea06ed' }}><code>🏁 RACE CONTROL ERROR: {error}</code></div>;
      }

      const seenDrivers = new Set();
      const baselineUniqueLaps = queryData.filter(lap => {
        if (seenDrivers.has(lap.driver_name)) return false;
        seenDrivers.add(lap.driver_name);
        return true;
      });

      const lapsWithDisplayPosition = baselineUniqueLaps.map((lap, index) => ({ ...lap, displayPosition: index + 1 }));
      const finalFilteredLaps = lapsWithDisplayPosition.filter(lap => lap.driver_name?.toLowerCase().includes(searchQuery.toLowerCase()));
      const p1Time = baselineUniqueLaps[0]?.best_lap_ms;
      const totalPages = Math.ceil(finalFilteredLaps.length / ITEMS_PER_PAGE);
      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const paginatedLaps = finalFilteredLaps.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      const getDriverStats = (driverName) => {
        if (!driverName) return null;
        const driverLaps = queryData.filter(l => l.driver_name === driverName);
        const bestLap = driverLaps[0];
        const carsDriven = Array.from(new Set(driverLaps.map(l => CAR_MODELS[l.car_model] || `Car ID: ${l.car_model}`)));
        const position = baselineUniqueLaps.findIndex(l => l.driver_name === driverName) + 1;
        return {
          name: driverName, bestLapMs: bestLap?.best_lap_ms, bestSplits: bestLap?.best_splits,
          totalSessions: driverLaps.length, carsDriven, position: position > 0 ? position : 'N/A',
          delta: formatDelta(bestLap?.best_lap_ms, p1Time), wetlap: bestLap?.wetlap
        };
      };
      const driverStats = activeDriverModal ? getDriverStats(activeDriverModal) : null;

                  </div>
                  <div>
                    <label style={{ fontSize: '11px', color: '#914cf2', display: 'block', fontFamily: 'monospace', marginBottom: '4px' }}>SWITCH CIRCUIT</label>
                    <select value={selectedTrack} onChange={(e) => setSelectedTrack(e.target.value)} style={{ backgroundColor: '#0a0812', color: '#fff', border: '1px solid #914cf2', padding: '6px 12px', fontFamily: 'monospace', fontSize: '14px', cursor: 'pointer' }}>
                      {uniqueTracks.map(t => <option key={t} value={t}>📍 {TRACK_NAMES[t.toLowerCase()] || t.toUpperCase()}</option>)}
                    </select>
                  </div>
                </div>
              )}
            </div>

            {selectedTrack === '' ? (
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(240px, 1fr))', gap: '15px' }}>
                {uniqueTracks.map(trackKey => (
                  <button 
                    key={trackKey} 
                    onClick={() => setSelectedTrack(trackKey)} 
                    style={{ backgroundColor: '#120d24', border: '1px solid #914cf2', padding: '18px 20px', textAlign: 'left', cursor: 'pointer', height: '100px', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', transition: 'all 0.15s ease' }}
                    onMouseEnter={(e) => { e.currentTarget.style.borderColor = '#ea06ed'; e.currentTarget.style.backgroundColor = '#191133'; e.currentTarget.style.transform = 'translateY(-2px)'; }}
                    onMouseLeave={(e) => { e.currentTarget.style.borderColor = '#914cf2'; e.currentTarget.style.backgroundColor = '#120d24'; e.currentTarget.style.transform = 'translateY(0)'; }}
                  >
                    <span style={{ fontSize: '10px', color: '#06f5ff', fontFamily: 'monospace' }}>CIRCUIT</span>
                    <span style={{ fontSize: '17px', fontWeight: 'bold', color: '#ffffff', fontStyle: 'italic', textTransform: 'uppercase' }}>
                      {TRACK_NAMES[trackKey.toLowerCase()] || trackKey.toUpperCase()}
                    </span>
                  </button>
                ))}
              </div>
            ) : (
              <>
                {/* Dynamic Podium Grid */}
                {currentPage === 1 && searchQuery === '' && baselineUniqueLaps.length > 0 && (
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '20px', marginBottom: '40px' }}>
                    {baselineUniqueLaps.slice(0, 3).map((lap, i) => {
                      const positions = [
                        { badge: '#06f5ff', text: '🥇 P1 INTERVAL LEADER', bg: '#191133', border: '#06f5ff', glow: 'rgba(49, 199, 205, 0.3)', timerColor: '#06f5ff' },
                        { badge: '#ea06ed', text: '🥈 P2 PURSUING', bg: '#120d24', border: '#ea06ed', glow: 'rgba(234, 6, 237, 0.2)', timerColor: '#ffffff' },
                        { badge: '#914cf2', text: '🥉 P3 PURSUING', bg: '#120d24', border: '#914cf2', glow: 'rgba(145, 76, 242, 0.2)', timerColor: '#ffffff' }
                      ][i];
                      return (
                        <div key={`podium-${lap.id}`} style={{ backgroundColor: positions.bg, border: `1px solid ${positions.border}`, padding: '20px', position: 'relative', boxShadow: `0 0 20px ${positions.glow}` }}>
                          <div style={{ color: positions.badge, fontSize: '11px', fontFamily: 'monospace', marginBottom: '10px', letterSpacing: '0.1em' }}>{positions.text}</div>
                          <div onClick={() => setActiveDriverModal(lap.driver_name)} style={{ fontSize: '22px', color: '#ffffff', fontStyle: 'italic', textTransform: 'uppercase', cursor: 'pointer', transition: 'color 0.2s' }}
                            onMouseEnter={(e) => e.currentTarget.style.color = '#06f5ff'}
                            onMouseLeave={(e) => e.currentTarget.style.color = '#ffffff'}
                          >
                            {lap.driver_name}
                          </div>
                          <div style={{ fontSize: '12px', color: '#a0a0c0', margin: '4px 0 10px 0', display: 'flex', alignItems: 'center' }}>
                            <ClassBadge carModel={lap.car_model} />
                            {CAR_MODELS[lap.car_model] || `Car ID: ${lap.car_model}`}
                          </div>
                          <div style={{ fontSize: '11px', color: '#06f5ff', fontFamily: 'monospace', marginBottom: '10px' }}>
                            TRACK: {TRACK_NAMES[lap.track?.toLowerCase()] || lap.track?.toUpperCase()}
                          </div>
                          <div style={{ marginBottom: '14px' }}>
                            <SectorSplitsDisplay splits={lap.best_splits} />
                          </div>
                          <div style={{ fontSize: '28px', fontFamily: 'monospace', color: positions.timerColor, textAlign: 'right', backgroundColor: '#0a0812', padding: '6px 12px', border: '1px solid #914cf2', display: 'flex', alignItems: 'center', justifyContent: 'flex-end' }}>
                            <WeatherBadge wetlap={lap.wetlap} />
                            {formatLapTime(lap.best_lap_ms)}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}

                <div style={{ backgroundColor: '#120d24', border: '1px solid #914cf2' }}>
                  <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left' }}>
                    <thead>
                      <tr style={{ backgroundColor: '#0a0812', borderBottom: '2px solid #ea06ed', color: '#ea06ed', fontSize: '12px', fontFamily: 'monospace' }}>
                        <th style={{ padding: '16px 20px', width: '70px' }}>POS</th>
                        <th style={{ padding: '16px 20px' }}>DRIVER</th>
                        <th style={{ padding: '16px 20px' }}>CAR MODEL</th>
                        <th style={{ padding: '16px 20px', textAlign: 'right' }}>DELTA</th>
                        <th style={{ padding: '16px 20px', textAlign: 'right' }}>BEST LAP TIME</th>
                      </tr>
                    </thead>
                    <tbody>
                      {paginatedLaps.map((lap, index) => {
                        const absoluteIndex = startIndex + index;
                        const isActualFirst = lap.displayPosition === 1;
                        return (
                          <tr key={lap.id} style={{ borderBottom: '1px solid #1a1233', backgroundColor: isActualFirst ? 'rgba(49, 199, 205, 0.05)' : (absoluteIndex % 2 === 0 ? '#100a20' : '#120d24') }}>
                            <td style={{ padding: '16px 20px', color: isActualFirst ? '#06f5ff' : '#914cf2', fontSize: '16px', fontStyle: 'italic', backgroundColor: isActualFirst ? 'rgba(49, 199, 205, 0.08)' : 'transparent', borderRight: isActualFirst ? '1px solid #06f5ff' : 'none', verticalAlign: 'top' }}>
                              {lap.displayPosition.toString().padStart(2, '0')}
                            </td>
                            <td style={{ padding: '16px 20px', fontStyle: 'italic', verticalAlign: 'top' }}>
                              <span onClick={() => setActiveDriverModal(lap.driver_name)} style={{ color: '#ffffff', textTransform: 'uppercase', fontSize: '12px', cursor: 'pointer', transition: 'color 0.2s' }}
                                onMouseEnter={(e) => e.currentTarget.style.color = '#06f5ff'}
                                onMouseLeave={(e) => e.currentTarget.style.color = '#ffffff'}
                              >
                                {lap.driver_name}
                              </span>
                            </td>
                            <td style={{ padding: '16px 20px', color: '#b0b0d0', fontSize: '13px', verticalAlign: 'top' }}>
                              <ClassBadge carModel={lap.car_model} />{CAR_MODELS[lap.car_model] || `Car ID: ${lap.car_model}`}
                            </td>
                            <td style={{ padding: '16px 20px', textAlign: 'right', color: isActualFirst ? '#06f5ff' : '#ea06ed', fontFamily: 'monospace', verticalAlign: 'top' }}>{formatDelta(lap.best_lap_ms, p1Time)}</td>
                            <td style={{ padding: '16px 20px', textAlign: 'right', fontFamily: 'monospace', fontSize: '16px', color: isActualFirst ? '#06f5ff' : '#ffffff', verticalAlign: 'top' }}>
                              <div><WeatherBadge wetlap={lap.wetlap} />{formatLapTime(lap.best_lap_ms)}</div>
                              <SectorSplitsDisplay splits={lap.best_splits} align="right" />
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>

                  {/* PAGINATION CONTROLS */}
                  {totalPages > 1 && (
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '16px 20px', backgroundColor: '#0a0812', borderTop: '1px solid #914cf2', fontFamily: 'monospace', fontSize: '12px' }}>
                      <div style={{ color: '#914cf2' }}>
                        SHOWING {startIndex + 1} - {Math.min(startIndex + ITEMS_PER_PAGE, finalFilteredLaps.length)} OF {finalFilteredLaps.length} DRIVERS
                      </div>
                      <div style={{ display: 'flex', gap: '8px' }}>
                        <button 
                          onClick={() => setCurrentPage(p => Math.max(p - 1, 1))} 
                          disabled={currentPage === 1}
                          style={{ backgroundColor: currentPage === 1 ? '#120d24' : '#191133', color: currentPage === 1 ? '#555' : '#06f5ff', border: '1px solid #914cf2', padding: '6px 12px', cursor: currentPage === 1 ? 'not-allowed' : 'pointer' }}
                        >
                          PREV
                        </button>
                        <span style={{ padding: '6px 10px', color: '#ffffff' }}>PAGE {currentPage} OF {totalPages}</span>
                        <button 
                          onClick={() => setCurrentPage(p => Math.min(p + 1, totalPages))} 
                          disabled={currentPage === totalPages}
                          style={{ backgroundColor: currentPage === totalPages ? '#120d24' : '#191133', color: currentPage === totalPages ? '#555' : '#06f5ff', border: '1px solid #914cf2', padding: '6px 12px', cursor: currentPage === totalPages ? 'not-allowed' : 'pointer' }}
                        >
                          NEXT
                        </button>
                      </div>
                    </div>
                  )}
                </div>
              </>
            )}
          </div>

       {/* DRIVER PROFILE MODAL POPUP */}
      {driverStats && (
        <div style={{
          position: 'fixed',
          top: 0,
          left: 0,
          right: 0,
          bottom: 0,
          backgroundColor: 'rgba(10, 8, 18, 0.85)',
          backdropFilter: 'blur(4px)',
          display: 'flex',
          justifyContent: 'center',
          alignItems: 'center',
          zIndex: 1000,
          padding: '20px'
        }}
        onClick={() => setActiveDriverModal(null)}
        >
          <div style={{
            backgroundColor: '#120d24',
            border: '1px solid #ea06ed',
            borderTop: '4px solid #06f5ff',
            padding: '28px',
            maxWidth: '480px',
            width: '100%',
            boxShadow: '0 0 35px rgba(234, 6, 237, 0.3)',
            position: 'relative'
          }}
          onClick={(e) => e.stopPropagation()}
          >
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '20px' }}>
              <div>
                <div style={{ fontSize: '11px', color: '#06f5ff', fontFamily: 'monospace', letterSpacing: '0.15em' }}>
                  DRIVER TELEMETRY PROFILE
                </div>
                <h2 style={{ margin: '4px 0 0 0', fontSize: '26px', color: '#ffffff', fontStyle: 'italic', textTransform: 'uppercase' }}>
                  {driverStats.name}
                </h2>
              </div>
              <button
                onClick={() => setActiveDriverModal(null)}
                style={{
                  backgroundColor: 'transparent',
                  color: '#ea06ed',
                  border: 'none',
                  fontSize: '20px',
                  fontWeight: 'bold',
                  cursor: 'pointer',
                  fontFamily: 'monospace',
                  lineHeight: '1'
                }}
              >
                ✕
              </button>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px', marginBottom: '20px' }}>
              <div style={{ backgroundColor: '#0a0812', padding: '12px', border: '1px solid #914cf2' }}>
                <div style={{ fontSize: '10px', color: '#914cf2', fontFamily: 'monospace' }}>POSITION</div>
                <div style={{ fontSize: '20px', color: '#06f5ff', fontFamily: 'monospace', fontWeight: 'bold' }}>P{driverStats.position}</div>
              </div>
              <div style={{ backgroundColor: '#0a0812', padding: '12px', border: '1px solid #914cf2' }}>
                <div style={{ fontSize: '10px', color: '#914cf2', fontFamily: 'monospace' }}>BEST LAP</div>
                <div style={{ fontSize: '20px', color: '#ffffff', fontFamily: 'monospace', display: 'flex', alignItems: 'center' }}>
                  <WeatherBadge wetlap={driverStats.wetlap} />
                  {formatLapTime(driverStats.bestLapMs)}
                </div>
              </div>
              <div style={{ backgroundColor: '#0a0812', padding: '12px', border: '1px solid #914cf2' }}>
                <div style={{ fontSize: '10px', color: '#914cf2', fontFamily: 'monospace' }}>DELTA TO P1</div>
                <div style={{ fontSize: '20px', color: '#ea06ed', fontFamily: 'monospace' }}>{driverStats.delta}</div>
              </div>
              <div style={{ backgroundColor: '#0a0812', padding: '12px', border: '1px solid #914cf2' }}>
                <div style={{ fontSize: '10px', color: '#914cf2', fontFamily: 'monospace' }}>SESSIONS RECORDED</div>
                <div style={{ fontSize: '20px', color: '#ffffff', fontFamily: 'monospace' }}>{driverStats.totalSessions}</div>
              </div>
            </div>

            {/* Modal Best Sector Splits */}
            <div style={{ backgroundColor: '#0a0812', padding: '12px', border: '1px solid #914cf2', marginBottom: '12px' }}>
              <div style={{ fontSize: '10px', color: '#914cf2', fontFamily: 'monospace', marginBottom: '6px' }}>BEST SECTOR SPLITS</div>
              <SectorSplitsDisplay splits={driverStats.bestSplits} align="left" />
            </div>

            <div style={{ backgroundColor: '#0a0812', padding: '12px', border: '1px solid #914cf2', marginBottom: '20px' }}>
              <div style={{ fontSize: '10px', color: '#914cf2', fontFamily: 'monospace', marginBottom: '6px' }}>CARS DRIVEN</div>
              <div style={{ fontSize: '13px', color: '#d4d4d4', fontFamily: 'sans-serif' }}>
                {driverStats.carsDriven.join(', ')}
              </div>
            </div>

            <button
              onClick={() => setActiveDriverModal(null)}
              style={{
                width: '100%',
                backgroundColor: '#191133',
                color: '#06f5ff',
                border: '1px solid #06f5ff',
                padding: '10px',
                fontFamily: 'monospace',
                fontSize: '12px',
                fontWeight: 'bold',
                cursor: 'pointer',
                letterSpacing: '0.1em',
                textTransform: 'uppercase'
              }}
            >
              CLOSE PROFILE
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
